<!DOCTYPE html>
<html lang="zh-CN" data-ui-theme="pearl-white">
<head>
  <meta charset="UTF-8" />
  <title>高德周边探索 · 设置</title>
  <link rel="stylesheet" href="cyrene-theme.css" />
  <style>
    body { display: flex; flex-direction: column; padding: 22px; }
    .card { padding: 22px 24px; display: flex; flex-direction: column; height: 100%; }
    .hint { margin: 6px 0 16px; }
    .actions { display: flex; gap: 10px; margin-top: 14px; }
    .actions .cy-btn { flex: 1; }
    .status { margin-top: 14px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card cy-card">
    <h1>高德周边探索</h1>
    <p class="cy-hint hint">
      配置高德 Web 服务 API Key 后，Cyrene 可以帮你搜地点、找周边好吃的好玩的。<br />
      Key 在 <a href="https://console.amap.com" target="_blank">console.amap.com</a> 创建，
      类型选「Web 服务」。
    </p>
    <label class="cy-label" for="key">API Key</label>
    <input id="key" type="password" class="cy-input" placeholder="粘贴高德 Web 服务 Key" autocomplete="off" />
    <div class="actions">
      <button id="save" class="cy-btn cy-btn--primary">保存</button>
      <button id="clear" class="cy-btn cy-btn--ghost-danger">清除已保存的 Key</button>
    </div>
    <div id="status" class="cy-status status"></div>
  </div>

  <script>
    const { ipcRenderer } = require("electron");
    const keyInput = document.getElementById("key");
    const saveBtn = document.getElementById("save");
    const clearBtn = document.getElementById("clear");
    const statusEl = document.getElementById("status");
    const CHANNEL = "plugin:amap-explorer";

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = `cy-status status ${kind ? "cy-status--" + kind : ""}`;
    }

    async function refresh() {
      try {
        const { hasKey } = await ipcRenderer.invoke(`${CHANNEL}:get-status`);
        clearBtn.disabled = !hasKey;
        if (hasKey) {
          keyInput.placeholder = "已保存（输入新值可覆盖）";
          setStatus("✓ 已配置 API Key", "ok");
        } else {
          setStatus("尚未配置 API Key", "muted");
        }
      } catch (err) {
        setStatus(`读取状态失败：${err?.message ?? err}`, "err");
      }
    }

    saveBtn.addEventListener("click", async () => {
      const key = keyInput.value.trim();
      if (!key) { setStatus("请先粘贴 API Key", "err"); return; }
      saveBtn.disabled = true;
      try {
        const result = await ipcRenderer.invoke(`${CHANNEL}:set-key`, key);
        if (result?.ok) {
          keyInput.value = "";
          setStatus("✓ 已保存，即刻生效", "ok");
        } else {
          setStatus(`保存失败：${result?.error ?? "未知错误"}`, "err");
        }
      } catch (err) {
        setStatus(`保存失败：${err?.message ?? err}`, "err");
      } finally {
        saveBtn.disabled = false;
        await refresh();
      }
    });

    clearBtn.addEventListener("click", async () => {
      clearBtn.disabled = true;
      try {
        await ipcRenderer.invoke(`${CHANNEL}:clear-key`);
        keyInput.placeholder = "粘贴高德 Web 服务 Key";
        setStatus("已清除 API Key", "muted");
      } catch (err) {
        setStatus(`清除失败：${err?.message ?? err}`, "err");
      } finally {
        await refresh();
      }
    });

    keyInput.addEventListener("keydown", (e) => { if (e.key === "Enter") saveBtn.click(); });
    refresh();
  </script>
</body>
</html>
